<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/nexleague-logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- SEO Meta Tags -->
		<title>NexLeague - League of Legends Summoner Search & Analysis</title>
		<meta name="description" content="Get in-depth League of Legends profile analysis, stats, and match history with NexLeague." />
		<meta name="keywords" content="League of Legends, LoL, summoner search, Riot ID, match history, stats, analysis, SvelteKit, Riot API, Gemini API" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://nexleague.vercel.app" /> 
		<meta property="og:title" content="NexLeague - League of Legends Summoner Search & Analysis" />
		<meta property="og:description" content="Get in-depth League of Legends profile analysis, stats, and match history with NexLeague." />
		<meta property="og:image" content="%sveltekit.assets%/nexleague-logo.png" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://nexleague.vercel.app" /> 
		<meta property="twitter:title" content="NexLeague - League of Legends Summoner Search & Analysis" />
		<meta property="twitter:description" content="Get in-depth League of Legends profile analysis, stats, and match history with NexLeague." />
		<meta property="twitter:image" content="%sveltekit.assets%/nexleague-logo.png" />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
